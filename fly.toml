# fly.toml — monty-server
# Docs: https://fly.io/docs/reference/configuration/
#
# Before first deploy:
#   1. fly launch --no-deploy                    # creates app
#   2. fly volumes create monty_data --size 10   # 10 GB persistent volume
#   3. fly secrets set \
#        GITHUB_CLIENT_ID=... \
#        GITHUB_CLIENT_SECRET=... \
#        SESSION_SECRET="$(openssl rand -hex 32)" \
#        BASE_URL=https://<your-app>.fly.dev
#   4. fly deploy

app = "monty-server"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"
  RUST_LOG = "info"

[[mounts]]
  source = "monty_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
