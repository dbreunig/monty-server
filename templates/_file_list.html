<div id="file-list">
{% if files.is_empty() %}
<p><em>No files.</em></p>
{% else %}
<table>
    <thead><tr><th>Name</th><th>Size</th><th></th></tr></thead>
    <tbody>
        {% for f in files %}
        <tr>
            <td>{{ f.name }}</td>
            <td>{{ f.size }}</td>
            <td>
                <button hx-delete="/envs/{{ env_id }}/files/{{ f.name }}"
                        hx-target="#file-list" hx-swap="outerHTML">Delete</button>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endif %}
</div>
