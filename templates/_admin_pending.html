<div id="pending">
{% if pending.is_empty() %}
<div class="empty-state">No pending accounts</div>
{% else %}
<div class="table-wrap">
<table class="data-table">
    <thead><tr><th>User</th><th>Email</th><th>Created</th><th></th></tr></thead>
    <tbody>
        {% for u in pending %}
        <tr>
            <td>{{ u.display_name() }}</td>
            <td class="muted">{% if let Some(email) = u.email.as_ref() %}{{ email }}{% else %}—{% endif %}</td>
            <td class="when"><time datetime="{{ u.created_at.to_rfc3339() }}">{{ u.created_at.format("%b %-d, %Y %H:%M") }}</time></td>
            <td class="actions">
                <button class="btn-primary btn-sm"
                        hx-post="/admin/approve/{{ u.id }}"
                        hx-target="#pending" hx-swap="outerHTML">Approve</button>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
</div>
{% endif %}
</div>
