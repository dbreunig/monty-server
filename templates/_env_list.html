<div id="env-list">
{% if envs.is_empty() %}
<div class="empty-state">No environments yet.</div>
{% else %}
<table class="data-table">
    <thead><tr><th>Name</th><th>Id</th><th>Updated</th><th></th></tr></thead>
    <tbody>
        {% for env in envs %}
        <tr data-href="/envs/{{ env.id }}">
            <td><a href="/envs/{{ env.id }}">{{ env.name }}</a></td>
            <td><code class="inline">{{ env.id }}</code></td>
            <td class="muted">{{ env.updated_at }}</td>
            <td class="actions">
                <button class="btn-danger btn-sm"
                        hx-delete="/envs/{{ env.id }}"
                        hx-confirm="Delete {{ env.name }}?"
                        hx-target="#env-list" hx-swap="outerHTML">Delete</button>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endif %}
</div>
