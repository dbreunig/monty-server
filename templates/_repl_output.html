<div class="repl-output">
<pre><span class="prompt">&gt;&gt;&gt;</span> <code class="language-python">{{ code }}</code></pre>
{% if !stdout.is_empty() %}<pre>{{ stdout }}</pre>{% endif %}
{% if !stderr.is_empty() %}<pre class="stderr">{{ stderr }}</pre>{% endif %}
{% if let Some(err) = error %}<pre class="stderr">{{ err }}</pre>{% endif %}
{% if let Some(res) = result %}<pre class="repl-result">= {{ res }}</pre>{% endif %}
</div>
