{% extends "base.html" %}
{% block title %}Admin — monty{% endblock %}
{% block body %}
<header class="topbar">
    <div class="topbar-inner">
        <nav class="crumbs">
            <a class="brand" href="/dashboard">monty</a>
            <span class="crumb-sep">/</span>
            <span class="crumb-current">Admin</span>
        </nav>
        <div class="topbar-actions">
            <form method="post" action="/auth/logout">
                <button type="submit" class="topbar-link">Sign out</button>
            </form>
        </div>
    </div>
</header>
<main class="page">

    <section class="section">
        <div class="section-header">
            <h2>Pending approvals</h2>
            <span class="count">{{ pending.len() }}</span>
        </div>
        <div id="pending">{% include "_admin_pending.html" %}</div>
    </section>
</main>
{% endblock %}
