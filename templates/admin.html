{% extends "base.html" %}
{% block title %}Admin — monty{% endblock %}
{% block body %}
<div class="page">
    <div class="pagebar">
        <nav class="crumbs">
            <a href="/dashboard">Dashboard</a>
            <span class="crumb-sep">/</span>
            <span class="crumb-current">Admin</span>
        </nav>
        <div class="pagebar-actions">
            <form method="post" action="/auth/logout">
                <button type="submit" class="pagebar-btn">Sign out</button>
            </form>
        </div>
    </div>

    <section class="section">
        <div class="section-header">
            <h2>Pending approvals</h2>
            <span class="count">{{ pending.len() }}</span>
        </div>
        <div id="pending">{% include "_admin_pending.html" %}</div>
    </section>
</div>
{% endblock %}
