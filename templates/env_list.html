{% extends "base.html" %}
{% block title %}Environments — {{ user.display_name() }}{% endblock %}
{% block content %}
<h1>Environments</h1>
<p><a href="/dashboard">← Dashboard</a></p>

<form hx-post="/envs" hx-target="#env-list" hx-swap="outerHTML">
    <label>Name: <input type="text" name="name" required></label>
    <button type="submit">Create environment</button>
</form>

<div id="env-list">{% include "_env_list.html" %}</div>
{% endblock %}
